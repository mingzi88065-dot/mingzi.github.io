name: 自动更新越狱源

on:
  push:
    paths:
      - 'pool/**'
  workflow_dispatch:

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置环境
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xz-utils zstd

      - name: 生成 Packages 文件 (按 Debian 规范放进 stable/main/binary-iphoneos-arm64/)
        run: |
          SUITE=stable
          COMP=main
          ARCH=iphoneos-arm64
          DEST="dists/${SUITE}/${COMP}/binary-${ARCH}"
          mkdir -p "${DEST}"
          dpkg-scanpackages -m pool /dev/null > "${DEST}/Packages"
          gzip  -9c -n "${DEST}/Packages" > "${DEST}/Packages.gz"
          bzip2 -9c "${DEST}/Packages" > "${DEST}/Packages.bz2"
          xz    -9c "${DEST}/Packages" > "${DEST}/Packages.xz"
          zstd  -q -19 -c "${DEST}/Packages" > "${DEST}/Packages.zst"

      - name: 生成 Release 文件
        working-directory: dists/stable
        run: |
          SUITE=stable
          COMP=main
          ARCH=iphoneos-arm64
          DIR="${COMP}/binary-${ARCH}"

          {
            echo "Origin: Mingzi Repo"
            echo "Label: Mingzi Repo"
            echo "Suite: ${SUITE}"
            echo "Version: 1.0"
            echo "Codename: ios"
            echo "Architectures: iphoneos-arm64"
            echo "Components: ${COMP}"
            echo "Description: rooless专用源"
            echo "Date: $(date -R)"
          } > Release

          echo "MD5Sum:" >> Release
          for f in Packages Packages.gz Packages.bz2 Packages.xz Packages.zst; do
            path="${DIR}/${f}"
            [ -f "$path" ] || continue
            echo " $(md5sum "$path" | cut -d' ' -f1) $(stat -c %s "$path") ${path}" >> Release
          done

          echo "SHA256:" >> Release
          for f in Packages Packages.gz Packages.bz2 Packages.xz Packages.zst; do
            path="${DIR}/${f}"
            [ -f "$path" ] || continue
            echo " $(sha256sum "$path" | cut -d' ' -f1) $(stat -c %s "$path") ${path}" >> Release
          done

      - name: 提交自动生成的更改
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dists/
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新源文件"
          git push
